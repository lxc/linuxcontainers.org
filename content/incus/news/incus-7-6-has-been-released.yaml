  # Documentation
  The Incus documentation can be found at:
  https://linuxcontainers.org/incus/docs/main/

  # Packages
  There are no official Incus packages as Incus upstream only releases regular release tarballs. The release tarball, client binaries and checksums can be found at: https://github.com/lxc/incus/releases/tag/v7.6.0

  Below are some available options to get Incus up and running.

  ## Installing the Incus server on Linux
  Incus is available for most common Linux distributions. You'll find detailed installation instructions in our documentation.
  https://linuxcontainers.org/incus/docs/main/installing/

  ## Homebrew package for the Incus client
  The client tool is available through HomeBrew for both Linux and MacOS.
  https://formulae.brew.sh/formula/incus

  ## Chocolatey package for the Incus client
  The client tool is available through Chocolatey for Windows users.
  https://community.chocolatey.org/packages/incus/7.6.0

  ## Winget package for the Incus client
  The client tool is also available through Winget for Windows users.
  https://winstall.app/apps/LinuxContainers.Incus

  # Support
  Monthly feature releases are only supported up until the next release comes out. Users needing a longer support length and less frequent changes should consider using Incus 7.0 LTS instead.

  Community support is provided at: https://discuss.linuxcontainers.org  
  Commercial support is available through: https://zabbly.com/incus  
  Bugs can be reported at: https://github.com/lxc/incus/issues
