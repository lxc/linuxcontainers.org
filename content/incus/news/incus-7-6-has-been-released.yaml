title: Incus 7.6 has been released
date: 2026/10/30 17:01
origin: https://discuss.linuxcontainers.org/t/incus-7-6-has-been-released/27462
content: |-
  The Incus team is pleased to announce the release of Incus 7.6!

  Another busy release with a strong focus on performance and smoother operations for larger environments, but that doesn't mean that standalone deployments have been left behind either with a number of improvements and new features targeting those too!

  [![Screenshot 2026-10-30 at 12.18.11 PM|690x450](upload://e2tC30QboZvgV2JAMxh4PltgDfv.webp)](https://linuxcontainers.org/incus/try-it/)

  As usual, you can try Incus for yourself online: https://linuxcontainers.org/incus/try-it/

  # Security fixes
  This release fixes 18 security issues:

   - [GHSA-3wxw-5gh2-j2x2](https://github.com/lxc/incus/security/advisories/GHSA-3wxw-5gh2-j2x2) (critical) - Container configuration injection through OCI image config and `oci.*` keys
   - [GHSA-5c64-j5m6-8433](https://github.com/lxc/incus/security/advisories/GHSA-5c64-j5m6-8433) (critical) - Restricted clients can create and access resources in the default project
   - [GHSA-5pgx-q9xx-j3qv](https://github.com/lxc/incus/security/advisories/GHSA-5pgx-q9xx-j3qv) (critical) - Restricted project users can read or overwrite host files through special files, hard links or symlinks in backup or image metadata
   - [GHSA-cwg9-8mc4-hf7j](https://github.com/lxc/incus/security/advisories/GHSA-cwg9-8mc4-hf7j) (critical) - Token operations exposed through the event stream and cancellable by any client
   - [GHSA-jcw9-v2ff-8m79](https://github.com/lxc/incus/security/advisories/GHSA-jcw9-v2ff-8m79) (critical) - Restricted project users can create resources in the default project, bypassing project isolation (host root via dnsmasq, host file read via mkfs)
   - [GHSA-p45f-gqqj-6qq3](https://github.com/lxc/incus/security/advisories/GHSA-p45f-gqqj-6qq3) (critical) - Path traversal through snapshot names in custom volume backups
   - [GHSA-q9fc-p923-6vp7](https://github.com/lxc/incus/security/advisories/GHSA-q9fc-p923-6vp7) (critical) - Path traversal, crash and storage pool restriction bypass through dependent volumes in migration
   - [GHSA-xg75-xf37-cph9](https://github.com/lxc/incus/security/advisories/GHSA-xg75-xf37-cph9) (critical) - Authentication and authorization bypass through unverified client certificate chains
   - [GHSA-3rgf-297m-775x](https://github.com/lxc/incus/security/advisories/GHSA-3rgf-297m-775x) (high) - Local users can hijack VM NBD migration and disk-export sockets
   - [GHSA-8r3h-vc36-6xpx](https://github.com/lxc/incus/security/advisories/GHSA-8r3h-vc36-6xpx) (high) - Restricted and view-only clients can read resources in the default project
   - [GHSA-9c46-v3hw-v6m8](https://github.com/lxc/incus/security/advisories/GHSA-9c46-v3hw-v6m8) (high) - Rebuilding a never-started container makes it boot without a user namespace, running as privileged
   - [GHSA-h2j8-4crh-vhfc](https://github.com/lxc/incus/security/advisories/GHSA-h2j8-4crh-vhfc) (high) - Incus exposes migration websocket secrets to project event listeners, allowing migration hijack
   - [GHSA-v736-5xp3-jghf](https://github.com/lxc/incus/security/advisories/GHSA-v736-5xp3-jghf) (high) - Guest API caller impersonation through a forged cgroup name
   - [GHSA-8mgx-h4v8-xqv2](https://github.com/lxc/incus/security/advisories/GHSA-8mgx-h4v8-xqv2) (medium) - S3 listener buffers signed request bodies before authentication
   - [GHSA-9f75-5fjw-5jvv](https://github.com/lxc/incus/security/advisories/GHSA-9f75-5fjw-5jvv) (medium) - Incus broadcasts OVN ACL log events with an empty project, leaking them across projects
   - [GHSA-f7xp-22ph-v444](https://github.com/lxc/incus/security/advisories/GHSA-f7xp-22ph-v444) (medium) - Incus guest-API image export ignores the guest's project, exposing other projects' images
   - [GHSA-pf5w-m8m6-5265](https://github.com/lxc/incus/security/advisories/GHSA-pf5w-m8m6-5265) (medium) - Recursive and all-projects responses disclose other projects' bucket S3 keys and profile configuration to restricted clients (incomplete fix of GHSA-x8gj-2q73-qr6j)
   - [GHSA-x6pw-mh5w-pq73](https://github.com/lxc/incus/security/advisories/GHSA-x6pw-mh5w-pq73) (medium) - Denial of service via a null snapshot entry in an instance backup

  # New features

  ## SR-IOV NIC live migration
  Virtual machines using `sriov` NICs can now be live migrated between cluster members.

  Two mechanisms are supported:

   - A new `failover` option on both `sriov` networks and NICs takes the name of a bridge (managed or not). Incus then adds a `virtio-net` failover NIC on that bridge alongside the SR-IOV VF, letting guests which support `virtio-net` failover transparently switch to it during the migration before getting a VF back on the target.
   - A new `variant` option selects a VFIO variant driver (currently `mlx5` for `mlx5_vfio_pci`) which allows for native VFIO live migration of the VF itself.

  Initial support for `switchdev` mode was also added, with Incus configuring the VF representors as needed and allowing VLANs to be used with such NICs.

      stgraber@vorash:~$ incus network create sriov0 --type=sriov parent=enp5s0f0 failover=incusbr0
      stgraber@vorash:~$ incus launch images:debian/13 v1 --vm --network sriov0
      stgraber@vorash:~$ incus move v1 --target server02

  Documentation: https://linuxcontainers.org/incus/docs/main/reference/network_sriov/

  ## Faster virtual machine live migrations
  Live migration of virtual machines now uses QEMU's `multifd` feature, transferring memory over multiple parallel channels and significantly improving throughput on fast networks.

  The memory and state transfer rate can also be capped through the new `instances.migration.bwlimit` server option, which is useful on shared networks where a single migration shouldn't be allowed to consume all the available bandwidth.

      stgraber@vorash:~$ incus config set instances.migration.bwlimit=500MiB

  Block volume transfers through the generic migration transport (used when the source and target storage drivers differ, as well as by `incus-migrate`) are now compressed with `lz4` when both sides support it.

  Documentation: https://linuxcontainers.org/incus/docs/main/server_config/

  ## Virtual machine I/O and memory performance
  A number of changes improve the performance of virtual machines:

   - `virtio` disks now run through a dedicated QEMU I/O thread, taking disk I/O off the main loop and improving both throughput and latency.
   - Virtual machines that don't need `virtiofs` (nested virtualization with `security.nesting` set to `true`, stateful migration or hosts without `virtiofsd`) are now started with regular memory rather than shared memory, allowing transparent huge pages to be used. This makes a very significant difference for nested virtualization.
   - Free page reporting is now enabled on the memory balloon, allowing the host to reclaim memory freed by the guest.
   - Large `write-zeroes` requests from the guest are now split into smaller chunks so that disk I/O limits apply to them properly.

  Documentation: https://linuxcontainers.org/incus/docs/main/explanation/performance_tuning/#virtual-machine-memory-allocation

  ## Custom volumes can follow their instances
  Custom storage volumes on local storage pools can now be set to move along with the virtual machine they're attached to when it's moved to another cluster member, through the new `migration.follow_instance` volume option.

  This only applies to volumes attached to a single virtual machine.

      stgraber@vorash:~$ incus storage volume set local data migration.follow_instance=true
      stgraber@vorash:~$ incus move v1 --target server02

  Documentation: https://linuxcontainers.org/incus/docs/main/howto/move_instances/

  ## Trusting a certificate authority
  A CA certificate can now be added to the trust store, in which case any client certificate issued by that CA is trusted as if the CA entry itself had been presented.

  Such clients are identified by the fingerprint of the CA entry and inherit its type, restrictions and projects. This makes it easy to use short-lived certificates from an internal PKI without having to update the trust store on every renewal.

      stgraber@vorash:~$ incus config trust add-certificate ca.crt --restricted --projects=dev

  Documentation: https://linuxcontainers.org/incus/docs/main/authentication/#trusting-a-certificate-authority

  ## OVN NIC security filtering
  The `security.mac_filtering`, `security.ipv4_filtering` and `security.ipv6_filtering` options are now available on OVN NICs, matching what's available on bridged NICs.

  They're implemented through OVN port security, restricting the source MAC address and, when IP filtering is enabled, the IP addresses (including any static routes) that the instance may use.

      stgraber@vorash:~$ incus config device set c1 eth0 security.mac_filtering=true security.ipv4_filtering=true security.ipv6_filtering=true

  Documentation: https://linuxcontainers.org/incus/docs/main/reference/devices_nic/#nic-ovn

  ## OVN network re-parenting
  The `parent` option of OVN networks, introduced in Incus 7.5, can now be changed on existing networks, moving the network from one logical router to another.

  Address forwards, load balancers and the SNAT rules of NICs with external addresses are moved along to the new parent. Removing the `parent` turns the network back into a standalone network.

      stgraber@vorash:~$ incus network set net2 parent=net3

  Documentation: https://linuxcontainers.org/incus/docs/main/reference/network_ovn/#child-networks

  ## NAT address with l2proxy ingress mode
  The `ipv4.nat.address` and `ipv6.nat.address` options on OVN networks were previously limited to uplinks using `ovn.ingress_mode=routed`.

  They're now also supported with the default `l2proxy` ingress mode, in which case the NAT address is advertised on the uplink through proxy ARP/NDP.

      stgraber@vorash:~$ incus network set ovn0 ipv4.nat.address=203.0.113.10

  Documentation: https://linuxcontainers.org/incus/docs/main/reference/network_ovn/

  ## BGP communities
  A new `bgp.communities` option on `bridge` and `ovn` networks takes a comma-separated list of standard BGP communities (`ASN:value`) which are attached to all the prefixes advertised by that network.

      stgraber@vorash:~$ incus network set incusbr0 bgp.communities=65000:100,65000:200

  Documentation: https://linuxcontainers.org/incus/docs/main/howto/network_bgp/

  ## Load balancer lifecycle events
  Network load balancers now emit `network-load-balancer-created`, `network-load-balancer-updated` and `network-load-balancer-deleted` lifecycle events.

  On top of that, a `network-load-balancer-health-changed` event is sent whenever a load balancer goes healthy or unhealthy, including the status of each of its backends' service monitors.

  Documentation: https://linuxcontainers.org/incus/docs/main/events/

  ## Cluster healing delay
  Cluster healing is commonly combined with external tooling that powers off the failed server through its BMC or PDU, to make sure it's not still accessing shared storage while its instances get restarted elsewhere.

  To make that reliable, Incus now sends a new `cluster-member-offline` lifecycle event as soon as a member is detected as offline and a new `cluster.healing_delay` server option controls how long to wait before the evacuation actually begins.

      stgraber@vorash:~$ incus config set cluster.healing_delay=60

  Documentation: https://linuxcontainers.org/incus/docs/main/howto/cluster_manage/

  ## TPM endorsement keys in instance state
  When `instances.tpm.platform_cert` is set, Incus provisions new TPM devices with endorsement keys and certificates signed by the platform CA.

  The public part of those endorsement keys is now exposed through the instance state (and shown in `incus info`), both as a SHA-256 fingerprint and as a PEM encoded public key, allowing an external attestation service to bind an endorsement key to a specific instance without accessing the guest.

      stgraber@vorash:~$ incus query /1.0/instances/v1/state | jq .tpm

  Documentation: https://linuxcontainers.org/incus/docs/main/reference/devices_tpm/#endorsement-keys

  ## Disk I/O counters in instance state
  The `disk` section of the instance state now includes a `counters` field for each disk, reporting bytes read and written along with the number of completed read and write operations.

  This is currently only populated for virtual machines, using the block statistics reported by QEMU.

      stgraber@vorash:~$ incus query /1.0/instances/v1/state | jq .disk

  ## Boot priority improvements
  The `boot.priority` option on NIC and disk devices can now be set to `skip` to exclude the device from the boot sequence of a virtual machine. NICs are now skipped by default, avoiding slow network boot attempts on every start.

  A new `boot.pxe` instance option (defaulting to `false`) enables PXE on all the NICs that are part of the boot sequence. HTTP boot remains always enabled for those NICs.

      stgraber@vorash:~$ incus config device set v1 eth0 boot.priority=10
      stgraber@vorash:~$ incus config set v1 boot.pxe=true

  Documentation: https://linuxcontainers.org/incus/docs/main/reference/devices_nic/

  ## S3 backup target region
  Instance and volume backups uploaded to an S3 compatible store can now be given a `region`, for stores whose region can't be derived from their URL.

  ## Client certificate generation
  The `incus remote generate-certificate` command now accepts `--tls-cert` and `--tls-key` to generate a separate client certificate and key at the chosen paths, as well as `--encrypt` to protect the newly generated private key with a passphrase.

      stgraber@vorash:~$ incus remote generate-certificate --tls-cert ./my-client.crt --tls-key ./my-client.key --encrypt
      stgraber@vorash:~$ incus remote add my-remote <token> --tls-cert ./my-client.crt --tls-key ./my-client.key

  Documentation: https://linuxcontainers.org/incus/docs/main/remotes/#generate-a-client-certificate

  ## Request details in the authorization scriptlet
  The `details` argument passed to the authorization scriptlet now includes the request `URL`, `Path`, `Query` parameters and HTTP `Method`, allowing for much finer grained authorization decisions.

  Documentation: https://linuxcontainers.org/incus/docs/main/authorization/#scriptlet

  ## TLS JWT cookie login
  Browser based clients can't set HTTP headers on WebSocket connections, which made it impossible for them to use TLS JWT tokens for things like the console or exec.

  New `/tls/login` and `/tls/logout` endpoints now allow such clients to send the token once and have it stored in a `Secure`, `HttpOnly` cookie which is then accepted by all API endpoints and WebSocket connections until the token expires.

  Documentation: https://linuxcontainers.org/incus/docs/main/authentication/

  ## OIDC opaque access tokens
  Incus now supports OIDC providers that issue opaque (non-JWT) access tokens.

  In that case, Incus verifies the ID token instead, checking that it was issued by the configured issuer for the configured client ID. The `incus` client transparently sends the ID token alongside the opaque access token.

  Documentation: https://linuxcontainers.org/incus/docs/main/authentication/#authentication-openid

  ## Preliminary loongarch64 support
  Incus can now run on `loongarch64` systems, including preliminary support for virtual machines with the matching EDK2 firmware.

  Documentation: https://linuxcontainers.org/incus/docs/main/architectures/

