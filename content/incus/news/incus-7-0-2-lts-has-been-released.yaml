title: Incus 7.0.2 LTS has been released
date: 2026/10/29 21:12
origin: https://discuss.linuxcontainers.org/t/incus-7-0-2-lts-has-been-released/27453
content: |-
  # Introduction
  The Incus team is pleased to announce the release of Incus 7.0.2!
  This is the second bugfix release for Incus 7.0 which is supported until June 2031.

  # Changes
  As usual this bugfix releases focus on stability and hardening.

  Minor improvements have also been backported, specifically anything which does not require data migration, database changes or cause any unexpected change to user facing behavior.

  The number of such improvements will decrease over time within the LTS branch.

  Some of the highlights for this release are:

   - Near-live migration (`incus move --refresh` and the `refresh-migrate` evacuation action)
   - Live project moves within a cluster
   - NVRAM variable management for virtual machines
   - Secure Boot key management for virtual machines
   - NVRAM and Secure Boot overrides at instance creation
   - NVRAM access from the QEMU scriptlet
   - New `incus low-level` command with `nvram`, `secureboot`, `repair` and `bitmaps` sub-commands
   - Port forwarding to instances with `incus port-forward`
   - OVN child networks sharing a parent's logical router
   - Multicast snooping and relay on OVN networks
   - Networks shared across projects through `restricted.networks.access`
   - DNS NOTIFY support for network zones
   - `dns.include_hosts` on bridge networks
   - `ipv6.ra` control on bridge and OVN networks
   - BGP unnumbered peers
   - Security tags for OpenFGA authorization
   - OIDC claims in the authorization scriptlet
   - Multiple authorizers with per-client routing
   - Cluster member and storage pool metrics
   - Image locations in the API
   - `initial.copy` for custom volume disks
   - Burst limits for NIC and disk devices
   - Combined byte/s and IOPS limits on disks
   - I/O limits for `unix-block` devices
   - Queuing disciplines on NIC devices
   - GPU clique for GPUDirect in virtual machines
   - Native-context GPU device type
   - `security.nesting` for virtual machines
   - `security.protection.start`
   - Fixed ID map ranges on non-isolated containers
   - Ceph `librbd` backend for virtual machines
   - ACME External Account Binding and HTTP-01 forwarding in clusters
   - CPU clusters in the resources API
   - NetBSD support for the Incus agent
   - Interactive exec sessions on Windows
   - Native Windows and macOS client installers
   - `--archive` for `incus file push` and `incus file pull`
   - `incus list --all-remotes`
   - Parallel compression with `pigz`
   - Modernized CLI table rendering

  Please note that this release raises the minimum requirements to Go 1.26 for building Incus and to Open vSwitch 3.3.0 and OVN 24.03.0 for OVN networking.

  This update also addresses the following security issues:

  * [CVE-2026-62313](https://github.com/lxc/incus/security/advisories/GHSA-53cg-qvg7-m8vg) (medium) - Project isolation restriction bypass by omitting `security.idmap.isolated`
  * [CVE-2026-62867](https://github.com/lxc/incus/security/advisories/GHSA-q7xw-r4w2-2wcm) (critical) - Argument injection through storage volume `block.create_options`
  * [CVE-2026-62940](https://github.com/lxc/incus/security/advisories/GHSA-qw5c-v953-38gw) (critical) - Project restriction bypass via instance migration config override
  * [CVE-2026-62941](https://github.com/lxc/incus/security/advisories/GHSA-mq9x-prm8-3vpw) (critical) - Project restriction bypass via cross-project instance copy
  * [CVE-2026-63125](https://github.com/lxc/incus/security/advisories/GHSA-6rqx-22hc-qm36) (critical) - Arbitrary file write on host via `backup.yaml` symlink in crafted image
  * [CVE-2026-63343](https://github.com/lxc/incus/security/advisories/GHSA-fmjx-5j3g-997p) (critical) - Arbitrary file read+write on host via `metadata.yaml` symlink in crafted image
  * [CVE-2026-81493](https://github.com/lxc/incus/security/advisories/GHSA-p2v3-6wvc-cv3p) (critical) - Arbitrary file write on host via image fingerprint path traversal
  * [CVE-2026-81494](https://github.com/lxc/incus/security/advisories/GHSA-7fj9-65v4-rp7h) (critical) - Arbitrary file write on host via image-planted symlinks and `oci.dns.*` newline injection
  * [CVE-2026-81495](https://github.com/lxc/incus/security/advisories/GHSA-67qw-68v3-36h6) (critical) - Arbitrary file write on host via path traversal in custom volume import
  * [CVE-2026-81496](https://github.com/lxc/incus/security/advisories/GHSA-26gp-p5fw-3r2h) (critical) - Arbitrary file write on host via path traversal in instance backup import
  * [CVE-2026-81497](https://github.com/lxc/incus/security/advisories/GHSA-4qxq-p5hm-3q3p) (high) - Arbitrary host file read+write via VM template path traversal (incomplete fix of CVE-2026-48752)
  * [CVE-2026-81498](https://github.com/lxc/incus/security/advisories/GHSA-m3j6-p3v3-qmjv) (high) - Container configuration newline injection through `nvidia.driver.capabilities`
  * [CVE-2026-81499](https://github.com/lxc/incus/security/advisories/GHSA-6v6x-387m-rj4w) (medium) - Project restriction bypass on network address sets
  * [CVE-2026-81500](https://github.com/lxc/incus/security/advisories/GHSA-9pqw-c7m4-xvg7) (medium) - Incus CLI path traversal when exporting an image from a malicious server
  * [CVE-2026-81501](https://github.com/lxc/incus/security/advisories/GHSA-c6wx-8679-hpr9) (medium) - Restricted client can import a private image from another project
  * [CVE-2026-115370](https://github.com/lxc/incus/security/advisories/GHSA-443p-7392-h4v2) (medium) - Restricted project can use pull mode migration through clustered refresh
  * [CVE-2026-115371](https://github.com/lxc/incus/security/advisories/GHSA-x8gj-2q73-qr6j) (high) - Restricted client can read storage bucket keys in the default project
  * [CVE-2026-115372](https://github.com/lxc/incus/security/advisories/GHSA-4cph-ccqv-hm3c) (critical) - Project restriction bypass for `block.create_options` via volume update, copy and move
  * [CVE-2026-115373](https://github.com/lxc/incus/security/advisories/GHSA-mfwv-x733-9446) (medium) - Authorization bypass lets a restricted client read any operation in another project
  * [CVE-2026-115374](https://github.com/lxc/incus/security/advisories/GHSA-mmj7-8rgf-mx2h) (high) - Read of other bucket objects via unsigned header on presigned S3 upload URL
  * [CVE-2026-115375](https://github.com/lxc/incus/security/advisories/GHSA-hpjh-q53p-f27r) (critical) - Arbitrary file write on host via path traversal in instance backup dependent volumes
  * [CVE-2026-115376](https://github.com/lxc/incus/security/advisories/GHSA-jh4v-j34r-2mgh) (high) - Project restriction bypass for custom volume copy with omitted source type
  * [CVE-2026-115377](https://github.com/lxc/incus/security/advisories/GHSA-579w-c4rw-c8q3) (critical) - Arbitrary file write on host via symlink in migration stream
  * [CVE-2026-115378](https://github.com/lxc/incus/security/advisories/GHSA-wfvq-qh87-gm4j) (medium) - Incus CLI arbitrary file write via malicious `incus-agent` during recursive file pull
  * [CVE-2026-85185 (LXD also affecting Incus)](https://github.com/canonical/lxd/security/advisories/GHSA-27q7-qwhm-c34p) (critical) - Arbitrary file write and deletion on host via unvalidated btrfs subvolume path in optimized backup and migration
  * [CVE-2026-85526 (LXD also affecting Incus)](https://github.com/canonical/lxd/security/advisories/GHSA-h85r-gjgx-g2rv) (critical) - Path traversal via btrfs optimized backup `subvolumes[].path`

  All of those have been previously fixed in regular monthly releases and been widely backported by the various distributions shipping Incus 7.0 LTS.

  The full list of commits is available below:

