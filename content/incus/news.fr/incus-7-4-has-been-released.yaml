title: Incus 7.4 est maintenant disponible
date: 2026/08/28 02:11
origin: https://discuss.linuxcontainers.org/t/incus-7-4-has-been-released/27169
content: |-
  <!--
  The Incus team is pleased to announce the release of Incus 7.4!
  -->
  L’équipe d’Incus est heureuse d’annoncer la sortie d’Incus 7.4 !

  <!--
  Another pretty busy month for us as we clear a lot of our Github backlog, fix quite a few longstanding bugs and land a good mix of new features too!
  -->
  Ce fut encore un mois bien rempli pour nous, avec au programme un grand ménage dans les problèmes nous ayant été remontés sur Github, des résolutions de bugs assez anciens et un bon nombre de nouvelles fonctionnalités !

  [![image|690x301](https://discuss.linuxcontainers.org/uploads/default/original/2X/3/3d4f14932cb45054944b17c3fd447c786b67ca32.png)](https://linuxcontainers.org/incus/try-it/)

  <!--
  As usual, you can try Incus for yourself online: [Linux Containers - Incus - Try it online](https://linuxcontainers.org/incus/try-it/)
  -->
  Comme d’habitude, vous pouvez l’essayer vous-même en ligne : https://linuxcontainers.org/incus/try-it/

  <!--
  # Security fixes
  -->
  # Correctifs de sécurité

  <!--
  This release fixes 2 security issues:
  -->
  Cette version corrige 2 vulnérabilités :

  <!--
  - [CVE-2026-81500](https://github.com/lxc/incus/security/advisories/GHSA-9pqw-c7m4-xvg7) (medium) - Client-side path traversal when exporting an image from a malicious server
  - [CVE-2026-81501](https://github.com/lxc/incus/security/advisories/GHSA-c6wx-8679-hpr9) (medium) - Private image import from another project by a restricted client
  -->
  - [CVE-2026-81500](https://github.com/lxc/incus/security/advisories/GHSA-9pqw-c7m4-xvg7) (modérée) – Client-side path traversal when exporting an image from a malicious server
  - [CVE-2026-81501](https://github.com/lxc/incus/security/advisories/GHSA-c6wx-8679-hpr9) (modérée) – Private image import from another project by a restricted client

  <!--
  # New features
  ## UEFI Secure Boot key management
  Following the introduction of NVRAM access in Incus 7.3, this release adds a full set of tools to manage the UEFI Secure Boot databases of virtual machines.
  -->
  # Nouvelles fonctionnalités
  ## Gestion des clefs UEFI Secure Boot
  Suite à l’ajout de la fonctionnalité d’interaction avec la NVRAM dans Incus 7.3, cette nouvelle version ajoute tout un outillage autour des bases de clefs UEFI Secure Boot pour les machines virtuelles.

  <!--
  A new `incus low-level secureboot` command allows listing, adding, removing, exporting and importing Secure Boot database entries.
  -->
  Une nouvelle commande `incus low-level secureboot` permet de lister, ajouter, supprimer, exporter et importer des entrées de bases de clefs Secure Boot.

      stgraber@vorash:~$ incus low-level secureboot list v1 db
      ┌──────┬───────────────────────┬──────────────┬───────────────────────────────────────┐
      │ TYPE │    OWNER GUID NAME    │ FINGERPRINT  │                SUBJECT                │
      ├──────┼───────────────────────┼──────────────┼───────────────────────────────────────┤
      │ x509 │ MICROSOFT_VENDOR_GUID │ 48e99b991f57 │ Microsoft Corporation UEFI CA 2011    │
      │      │                       ├──────────────┼───────────────────────────────────────┤
      │      │                       │ 076f1fea90ac │ Windows UEFI CA 2023                  │
      │      │                       ├──────────────┼───────────────────────────────────────┤
      │      │                       │ e5be3e64c6e6 │ Microsoft Option ROM UEFI CA 2023     │
      │      │                       ├──────────────┼───────────────────────────────────────┤
      │      │                       │ e8e95f0733a5 │ Microsoft Windows Production PCA 2011 │
      │      │                       ├──────────────┼───────────────────────────────────────┤
      │      │                       │ f6124e34125b │ Microsoft UEFI CA 2023                │
      └──────┴───────────────────────┴──────────────┴───────────────────────────────────────┘

  <!--
  For those wanting to fully control the initial state of the NVRAM, a new set of `initial.*` instance configuration keys are also available, allowing for the databases to be populated at instance creation time, ideal for us with profiles.
  -->
  Les personnes souhaitant un contrôle total de l’état de base de la NVRAM peuvent à présent utiliser le nouvel ensemble de clefs de configuration d’instance `initial.*`, idéal pour des profils.

  <!--
  - `initial.secureboot.pk`, `initial.secureboot.kek`, `initial.secureboot.db`, `initial.secureboot.dbx`, `initial.secureboot.dbt` and `initial.secureboot.mok` to enroll Secure Boot database entries
  - `initial.nvram.<GUID>.<name>` and `initial.nvram-binary.<GUID>.<name>` to set other arbitrary NVRAM entries
  -->
  - `initial.secureboot.pk`, `initial.secureboot.kek`, `initial.secureboot.db`, `initial.secureboot.dbx`, `initial.secureboot.dbt` et `initial.secureboot.mok`, pour enrôler des clefs dans l’une des bases de clefs Secure Boot ;
  - `initial.nvram.<GUID>.<nom>` et `initial.nvram-binary.<GUID>.<nom>`, pour définir des variables dans la NVRAM.

  <!--
  Documentation: https://linuxcontainers.org/incus/docs/main/reference/instance_options/
  -->
  Documentation : https://linuxcontainers.org/incus/docs/main/reference/instance_options/

  <!--
  ## Near-live migration of containers
  Live migration of containers through CRIU has always been somewhat fragile as it depends on the exact workload running inside of the container being compatible with CRIU.
  -->
  ## Migration quasi à chaud de conteneurs
  La migration à chaud de conteneurs via CRIU a toujours été assez fragile, puisqu’elle impose aux processus de n’utiliser que des fonctionnalités compatibles avec CRIU.

  <!--
  Incus 7.4 introduces an alternative for containers on local storage, near-live migration.
  -->
  Incus 7.4 ajoute une alternative pour les conteneurs tournant sur du stockage local, la migration quasi à chaud.

  <!--
  Rather than transferring the memory state, the container's filesystem is transferred to the target server through a series of incremental snapshots while the container keeps running. Only the last incremental transfer requires the container to be stopped, after which it's started back up on the target server.
  -->
  Plutôt que de transférer l’état de la mémoire, seul le système de fichiers est transféré au serveur cible, par l’intermédiaire d’une série d’instantanés incrémentaux à chaud. Seul le dernier instantané demande l’arrêt du conteneur, après quoi il est démarré à nouveau sur le serveur cible.

  <!--
  This isn't a live migration as the container does get restarted, but the downtime is limited to that final transfer, which is usually very quick and allows for very large containers to be moved with very limited downtime.
  -->
  Il ne s’agit pas d’une migration à chaud puisque le conteneur est redémarré, mais le temps d’arrêt est limité au dernier transfert d’instantané, lequel est habituellement très rapide, permettant à des gros conteneurs d’être déplacés avec très peu d’indisponibilité.

  <!--
  This is available through the new `--refresh` flag of `incus move`, both when moving between cluster members and when moving between remote servers:
  -->
  La fonctionnalité peut être utilisée avec le nouveau drapeau `--refresh` de `incus move`, à la fois pour des déplacements au sein d’un cluster ou vers des serveurs distants :

      stgraber@vorash:~$ incus move c1 --target incus02 --stateless --refresh

  <!--
  or
  -->
  ou

      stgraber@vorash:~$ incus move c1 remote-server:c1 --stateless --refresh

  <!--
  A matching `refresh-migrate` value was added to the `cluster.evacuate` instance configuration key making it possible to enable this behavior during cluster evacuations.
  -->
  Une valeur `refresh-migrate` correspondante est maintenant disponible pour la clef de configuration d’instance `cluster.evacuate`, permettant d’utiliser ce comportement lors des évacuations.

  <!--
  Note that this is only supported on ZFS or btrfs and only for containers as other storage drivers don't have an efficient snapshot transfer mechanism for remote transfers.
  -->
  Notez que la fonctionnalité ne concerne que les conteneurs et n’est disponible que pour ZFS et btrfs, les autres drivers de stockage ne disposant pas de mécanisme de transfert d’instantanés efficace entre serveurs.

  <!--
  Documentation: https://linuxcontainers.org/incus/docs/main/howto/move_instances/
  -->
  Documentation : https://linuxcontainers.org/incus/docs/main/howto/move_instances/

  <!--
  ## One-time boot override for virtual machines
  The `incus start` command gained a new `--override-boot` flag allowing for picking what a VM should be booting from next.
  -->
  ## Modification temporaire de la séquence de démarrage des VM
  La commande `incus start` a désormais un nouveau drapeau `--override-boot` permettant de choisir, pour une VM, la prochaine entrée de démarrage utilisée.

  <!--
  It can be given a specific boot entry, or if left empty, will show an interactive list of the boot entries present in the NVRAM to pick from.
  -->
  Il est possible de passer soit le numéro de la prochaine entrée de démarrage, soit aucun paramètre, auquel cas une liste interactive des options disponibles est présentée.

      stgraber@vorash:~$ incus start v1 --override-boot
      ┌────┬────────────────────────────────┬────────────────────────────────────────────────────────────────────────────────────────┐
      │ ID │          DESCRIPTION           │                                          PATH                                          │
      ├────┼────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────┤
      │ 0  │ BootManagerMenuApp             │ Fv(64074afe-340a-4be6-94ba-91b5b4d0f71e)/FvFile(eec25bdc-67f2-4d95-b1d5-f81b2039d11d)  │
      ├────┼────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────┤
      │ 1  │ EFI Firmware Setup             │ Fv(64074afe-340a-4be6-94ba-91b5b4d0f71e)/FvFile(462caa21-7614-4503-836e-8ab6f4662331)  │
      ├────┼────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────┤
      │ 2  │ UEFI QEMU QEMU HARDDISK        │ PciRoot(0x0)/Pci(0x1,0x1)/Pci(0x0,0x0)/Scsi(0x0,0x1)                                   │
      ├────┼────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────┤
      │ 3  │ UEFI PXEv4 (MAC:10666AA0CED7)  │ PciRoot(0x0)/Pci(0x1,0x4)/Pci(0x0,0x0)/MAC(10666aa0ced7,0x1)/IPv4(0.0.0.0,0x0)         │
      ├────┼────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────┤
      │ 4  │ UEFI PXEv6 (MAC:10666AA0CED7)  │ PciRoot(0x0)/Pci(0x1,0x4)/Pci(0x0,0x0)/MAC(10666aa0ced7,0x1)/IPv6(::,0x0,Static)       │
      ├────┼────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────┤
      │ 5  │ UEFI HTTPv4 (MAC:10666AA0CED7) │ PciRoot(0x0)/Pci(0x1,0x4)/Pci(0x0,0x0)/MAC(10666aa0ced7,0x1)/IPv4(0.0.0.0,0x0)/Uri()   │
      ├────┼────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────┤
      │ 6  │ UEFI HTTPv6 (MAC:10666AA0CED7) │ PciRoot(0x0)/Pci(0x1,0x4)/Pci(0x0,0x0)/MAC(10666aa0ced7,0x1)/IPv6(::,0x0,Static)/Uri() │
      └────┴────────────────────────────────┴────────────────────────────────────────────────────────────────────────────────────────┘
      Select next boot entry: 1

  <!--
  ## Sharing networks with restricted projects
  Projects with `features.networks` enabled can now be granted access to networks from the `default` project through the `restricted.networks.access` configuration key.
  -->
  ## Partage de réseaux avec des projets restreints
  Les projets dans lesquels `features.networks` est activé peuvent désormais se voir accorder l’accès à une liste de réseaux du projet `default`, via la clef de configuration `restricted.networks.access`.

  <!--
  The listed networks get shared into the project, appearing in `incus network list` and being usable by instances of the project, while the project remains free to create its own OVN networks alongside. This makes it possible to offer a common bridge or physical uplink to a restricted project without giving up on per-project networking.
  -->
  Les réseaux ainsi listés sont partagés avec le projet, apparaissent dans `incus network list`, et sont utilisables par les instances du projet. Il est bien sûr toujours possible pour le projet de gérer ses propres réseaux dédiés via OVN. La fonctionnalité permet de fournir un bridge ou un uplink commun à un projet restreint, sans sacrifier la possibilité pour celui-ci de gérer ses propres réseaux.

  <!--
  Documentation: https://linuxcontainers.org/incus/docs/main/reference/projects/
  -->
  Documentation : https://linuxcontainers.org/incus/docs/main/reference/projects/

  <!--
  ## DNS NOTIFY support for network zones
  The built-in DNS server used for network zones now sends DNS NOTIFY messages to all configured peers whenever the content of a zone changes.
  -->
  ## Support de DNS NOTIFY pour les zones réseau
  Le serveur DNS interne utilisé pour gérer les zones réseau envoie désormais des messages DNS NOTIFY à tous les pairs configurés dès que le contenu d’une zone change.

  <!--
  This lets secondary DNS servers refresh the zone immediately rather than having to wait for the refresh interval. The regular refresh interval was therefore bumped up to 15 minutes.
  -->
  Cela permet aux serveurs DNS secondaires de rafraîchir les zones sans avoir à attendre le délai de rafraîchissement de celles-ci. De ce fait, ce délai a été augmenté à 15 minutes.

  <!--
  Documentation: https://linuxcontainers.org/incus/docs/main/howto/network_zones/
  -->
  Documentation : https://linuxcontainers.org/incus/docs/main/howto/network_zones/

  <!--
  ## New table rendering in the CLI
  We've tweaked the rendering of the lists in the CLI, offering a more polished and slightly more compact look.
  -->
  ## Nouveau rendu des tableaux dans la CLI
