title: Incus 7.5 リリースのお知らせ
date: 2026/09/25 15:30
origin: https://discuss.linuxcontainers.org/t/incus-7-5-has-been-released/27273
content: |-
  <!--
  The Incus team is pleased to announce the release of Incus 7.5!
  -->
  Incus チームは、Incus 7.5 のリリースのアナウンスができてうれしいです!

  <!--
  This release introduces another good mix of new features for everyone, touching storage, network, clustering, access control, OCI containers and improved agent support. It also significantly improves performance for large scale environments and fixes a variety of bugs and security issues.
  -->
  今回のリリースでは、ストレージ、ネットワーク、クラスタリング、アクセスコントロール、OCI コンテナ、エージェントサポートの改良など、あらゆるユーザーにとって役に立つ新機能を多数導入しました。また、大規模環境におけるパフォーマンスが大幅に向上し、様々なバグやセキュリティの問題も修正しました。

  [![image|690x322](https://discuss.linuxcontainers.org/uploads/default/original/2X/6/6b40d2360eb7b12e42df590b41fdcab65667a602.png)](https://linuxcontainers.org/incus/try-it/)

  <!--
  As usual, you can try Incus for yourself online: [Linux Containers - Incus - Try it online](https://linuxcontainers.org/incus/try-it/)
  -->
  いつものように、オンラインでご自身で試せます: [Linux Containers - Incus - オンラインでの試用](https://linuxcontainers.org/ja/incus/try-it/)

  <!--
  NOTE: The actual release version for download is 7.5.1 as 7.5.0 failed producing some of the release artifacts and needed a re-release.
  -->
  注意: 実際にダウンロードするリリースバージョンは 7.5.1 になります。7.5.0 はリリースに必要な成果物の一部が生成されず、再リリースが必要になりました。

  # セキュリティ修正 <!-- Security fixes -->

  <!--
  This release fixes 11 security issues:
  -->
  このリリースでは、11 の脆弱性を修正しました:

  - [CVE-2026-85185](https://github.com/canonical/lxd/security/advisories/GHSA-27q7-qwhm-c34p) (critical) - 最適化されたバックアップとマイグレーションにおける btrfs サブボリュームのパストラバーサルを介したホスト上での任意のファイル削除とディレクトリー配置 <!-- Arbitrary file deletion and directory placement on host via btrfs subvolume path traversal in optimized backups and migration -->
  - [CVE-2026-85526](https://github.com/canonical/lxd/security/advisories/GHSA-h85r-gjgx-g2rv) (critical) - 最適化されたバックアップにおける btrfs サブボリュームのパストラバーサルを介したホスト上のファイル削除とディレクトリー配置 <!-- Arbitrary file deletion and directory placement on host via btrfs subvolume path traversal in optimized backups -->
  - [GHSA-443p-7392-h4v2](https://github.com/lxc/incus/security/advisories/GHSA-443p-7392-h4v2) (medium) - 制限付きプロジェクトが、クラスターリフレッシュを通して pull モードを使える <!-- Restricted project can use pull mode migration through clustered refresh -->
  - [GHSA-4cph-ccqv-hm3c](https://github.com/lxc/incus/security/advisories/GHSA-4cph-ccqv-hm3c) (critical) - ボリューム更新、コピー、移動を介した `block.create_options` に対するプロジェクト制限の回避 <!-- Project restriction bypass for `block.create_options` via volume update, copy and move -->
  - [GHSA-579w-c4rw-c8q3](https://github.com/lxc/incus/security/advisories/GHSA-579w-c4rw-c8q3) (critical) - マイグレーションストリーム内のシンボリックリンクを介したホスト上の任意のファイルへの書き込み <!-- Arbitrary file write on host via symlink in migration stream -->
  - [GHSA-hpjh-q53p-f27r](https://github.com/lxc/incus/security/advisories/GHSA-hpjh-q53p-f27r) (critical) - インスタンスバックアップ依存ボリューム内のパストラバーサルを介したホスト上の任意のファイルへの書き込み <!-- Arbitrary file write on host via path traversal in instance backup dependent volumes -->
  - [GHSA-jh4v-j34r-2mgh](https://github.com/lxc/incus/security/advisories/GHSA-jh4v-j34r-2mgh) (high) - ソースタイプを省略したカスタムボリュームコピーのプロジェクト制限の回避 <!-- Project restriction bypass for custom volume copy with omitted source type -->
  - [GHSA-mfwv-x733-9446](https://github.com/lxc/incus/security/advisories/GHSA-mfwv-x733-9446) (medium) - 認証バイパスにより、制限つきクライアントが他のプロジェクトのあらゆる操作を読み取れる <!-- Authorization bypass lets a restricted client read any operation in another project -->
  - [GHSA-mmj7-8rgf-mx2h](https://github.com/lxc/incus/security/advisories/GHSA-mmj7-8rgf-mx2h) (high) - 事前署名されたS3アップロードURL上の署名なしヘッダーを介した他のバケットオブジェクトの読み取り <!-- Read of other bucket objects via unsigned header on presigned S3 upload URL -->
  - [GHSA-wfvq-qh87-gm4j](https://github.com/lxc/incus/security/advisories/GHSA-wfvq-qh87-gm4j) (medium) - Incus CLI による再帰的なファイルのプル中の悪意のある `incus-agent` を介した任意のファイルへの書き込み <!-- Incus CLI arbitrary file write via malicious `incus-agent` during recursive file pull -->
  - [GHSA-x8gj-2q73-qr6j](https://github.com/lxc/incus/security/advisories/GHSA-x8gj-2q73-qr6j) (high) - 制限付きクライアントがデフォルトプロジェクトのストレージバケットキーを読み取ることができる <!-- Restricted client can read storage bucket keys in the default project -->

  # 新機能 <!-- New features -->
  ## OVN 子ネットワーク <!-- OVN child networks -->
  <!--
  OVN networks can now be created with a `parent` pointing to another OVN network in the same project.
  -->
  OVN ネットワークは、同じプロジェクト内の別のネットワークを指す `parent` を指定して作成できるようになりました。

  <!--
  Rather than getting a logical router of its own, the child network attaches its logical switch and subnet to the logical router of its parent. This allows several internal subnets to be routed by a single logical router, sharing its uplink, external address and peerings.
  -->
  子ネットワークは、独自の論理ルーターを持つのではなく、その論理スイッチとサブネットを親ネットワークの論理ルーターに接続します。これにより、複数の内部サブネットを単一の論理ルーターでルーティングし、アップリンク、外部アドレス、ピアリングを共有できるようになります。

      stgraber@vorash:~$ incus network create net1 --type=ovn network=UPLINK ipv4.address=192.0.2.1/24
      stgraber@vorash:~$ incus network create net2 --type=ovn parent=net1 ipv4.address=198.51.100.1/24
      stgraber@vorash:~$ incus launch images:debian/13 c1 --network net2

  <!--
  A child network keeps its own subnet, DHCP, DNS records, ACLs and instance ports. It can enable NAT independently of its parent and can use `ipv4.nat.address` and `ipv6.nat.address` to translate to an address of its own, making it possible to have one subnet translated while another is routed natively on the same router.
  -->
  子ネットワークは独自のサブネット、DHCP、DNS レコード、ACL、インスタンスポートを保持します。親ネットワークとは独立して NAT を有効化でき、`ipv4.nat.address` や`ipv6.nat.address` を使用して独自のアドレスへ転送できます。これにより、あるサブネットを NAT 変換する一方で、別のサブネットは同じルーター上でネイティブにルーティングすると言った構成が取れるようになります。

  <!--
  Peerings are handled by the parent network and cover the subnets of all its children.
  -->
  ピアリングは親ネットワークによって処理され、その子ネットワークのすべてのサブネットをカバーします。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/network_ovn/#child-networks

  ## プロジェクトのクラスター内のライブによる移動 <!-- Live project moves within a cluster -->
  <!--
  A running instance can now be moved to a different project as part of a live migration to another cluster member by combining `\-\-target-project` with `\-\-target`.
  -->
  `--target-project` と `--target` を組み合わせることで、実行中のインスタンスを、別のクラスターメンバーへのライブマイグレーションの一環として、異なるプロジェクトに移動できるようになりました。

      stgraber@vorash:~$ incus move v1 --target incus02 --target-project prod

  <!--
  The instance's devices must resolve to the same set in the target project.
  Custom volumes marked as `dependent` will follow the instance.
  -->
  ターゲットプロジェクトでも、インスタンスのデバイス構成が同一である必要があります。
  `dependent` としてマークされたカスタムボリュームは、インスタンスとともに移動します。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/howto/move_instances/

  ## カスタムボリュームディスクの初期コピー <!-- Initial copy for custom volume disks -->
  <!--
  `disk` devices backed by a custom storage volume and attached to containers gained an `initial.copy` property.
  -->
  カスタムストレージボリュームをバックエンドにし、コンテナにアタッチされる `disk` デバイスに、`initial.copy` プロパティーが追加されました。

  <!--
  When set to `true`, the content already present at the device `path` inside the container is copied into the volume the first time the volume is used, if it's empty. This matches what application containers expect when shipping data in the directories that later get volumes mounted onto them.
  -->
  これを `true` に設定すると、ボリュームが空の状態で初めて使用される時に、コンテナ内のデバイスの `path` に存在するコンテンツがボリュームにコピーされます。これは、アプリケーションコンテナが期待する、あとでボリュームがマウントされるディレクトリー内にデータを格納する際の動作と整合性が取れています。

      stgraber@vorash:~$ incus storage volume create default mysql-data
      stgraber@vorash:~$ incus config device add mysql data disk pool=default source=mysql-data path=/var/lib/mysql initial.copy=true

  <!--
  The copy only ever happens once per volume, as recorded in the volume's `volatile.initial.copied` key.
  -->
  コピーはボリュームごとに一度だけ実行され、そのことはボリュームの `volatile.initial.copied` キーに記録されます。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/devices_disk/#initial-copy

  ## インスタンスセキュリティータグ <!-- Instance security tags -->
  <!--
  A new `security.tags` instance configuration key holds a comma-separated list of tags.
  -->
  カンマ区切りのタグのリストを設定する `security.tags` インスタンス設定キーが新たに追加されました。

  <!--
  Incus doesn't use those tags in its own authorization decisions, instead they're exposed to the authorization backend. With OpenFGA, every tag becomes a `security_tag` object holding a `tag` relation with every instance carrying it, making it easy for external tooling to write policies based on tags rather than on individual instances.
  -->
  Incus 自身は、このタグを認証の判断には使用せず、認証バックエンドに対して公開します。OpenFGA の場合、それぞれのタグが `security_tag` オブジェクトとなり、保持する `tag` リレーションを通して、そのタグを持つすべてのインスタンスと関連付けられます。

      stgraber@vorash:~$ incus config set c1 security.tags=pci,production

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/authorization/#security-tags

  ## 認証スクリプトレット内の OIDC クレーム <!-- OIDC claims in the authorization scriptlet -->
  <!--
  The `details` argument passed to the authorization scriptlet gained a `Claims` field holding the validated OIDC token claims of the client.
  -->
  認証スクリプトレットに渡される `details` 引数に、クライアントが認証済み OIDC クレームを持つ `Claims` フィールドが追加されました。

  <!--
  This allows writing rules based on any claim provided by the identity provider, such as `groups` or `email`, without having to maintain a separate mapping in the scriptlet.
  -->
  これにより、スクリプトレット内で別途マッピングを持つことなく、`groups` や `email` のような ID プロバイダーから提供される任意のクレームに基づくルールを書くことができます。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/authorization/#scriptlet

  ## クラスターメンバーメトリクス <!-- Cluster member metrics -->
  <!--
  The `/1.0/metrics` endpoint now reports cluster member information:
  -->
  `/1.0/metrics` エンドポイントが、クラスターメンバーの情報を報告するようになりました:

  - `incus_cluster_member` メンバーのアーキテクチャーと障害ドメイン <!-- with the member's architecture and failure domain -->
  - `incus_cluster_member_status` 可能性のあるステータスごとに 1 つのサンプル <!-- with one sample per possible status -->
  - `incus_cluster_member_role` ロールごとに 1 つのサンプルを保持 <!-- with one sample per role held -->
  - `incus_cluster_member_group` メンバーが属するグループごとに 1 つのサンプル <!-- with one sample per group the member belongs to -->

  <!--
  This makes it easy to alert on an offline or evacuated cluster member directly from Prometheus.
  -->
  これにより、簡単に Prometheus から直接、オフラインもしくは退避したメンバーに関するアラートを発信できます。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/provided_metrics/

  ## 仮想マシン向け NVIDIA GPUDirect P2P <!-- NVIDIA GPUDirect P2P for virtual machines -->
  <!--
  Physical `gpu` devices passed through to virtual machines gained a `nvidia.clique` configuration key.
  -->
  仮想マシンにパススルーされる物理的な `gpu` デバイスに、`nvidia.clique` 設定キーを追加されました。

  <!--
  Setting the same clique ID (0 to 15) on several GPUs passed to the same virtual machine advertises them as a GPUDirect P2P clique to the guest driver, allowing direct DMA between the GPUs.
  -->
  同じ仮想マシンに割り当てられた複数の GPU に対して同じ clique ID（0〜15）を設定すると、それらはゲストドライバーに対して GPUDirect P2P clique として認識され、GPU 間で直接的な DMA が可能になります。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/devices_gpu/

  ## Windows エージェントの改良 <!-- Improved Windows agent -->
  <!--
  The Windows agent now allows for interactive `incus exec` sessions and also improves handling for signal forwarding.
  -->
  Windows エージェントで対話型 `incus exec` セッションが可能になり、シグナル転送処理も改良されました。

  ## NetBSD 仮想マシン <!-- NetBSD virtual machines -->
  <!--
  The Incus agent is now available for NetBSD guests, on top of the existing Linux, FreeBSD, macOS and Windows support.
  -->
  Incus エージェントは、既存の Linux、FreeBSD、macOS、Windows サポートに加えて、NetBSD ゲストが利用可能になりました。

  <!--
  As with the other BSDs, setting `image.os` to something starting with `NetBSD` will automatically apply the needed tuning to the virtual machine.
  -->
  他の BSD 系と同様に、`image.os` に `NetBSD` で始まる値を設定すると、仮想マシンに対して必要なチューニングが自動的に適用されます。

  ## FreeBSD クライアントパッケージ <!-- FreeBSD client package -->
  <!--
  The Incus client is now packaged in FreeBSD Ports and can be installed with `pkg install incus-client`. Prebuilt FreeBSD client binaries are also included with every release.
  -->
  Incus クライアントは FreeBSD Ports にパッケージ化されており、`pkg install incus-client` コマンドでインストールできます。各リリースにはあらかじめビルドされたクライアントバイナリーも含まれています。

  ## ファイル転送のアーカイブモード <!-- Archive mode for file transfers -->
  <!--
  `incus file push` and `incus file pull` gained an `--archive` (`-a`) flag, behaving like `cp -a`.
  -->
  `incus file push` と `incus file pull` に `--archive`（`-a`）フラグが追加されました。`cp -a` のように動きます。

  <!--
  Ownership, mode and timestamps are now only preserved when using `--archive` (which also implies `--recursive`), with regular transfers behaving like a plain `cp`.
  -->
  所有権、モード、タイムスタンプは `--archive`（`--recursive` も含む）を使用したときだけ保持されるようになりました。通常の転送は、単純な `cp` コマンドと同様に動作します。

      stgraber@vorash:~$ incus file pull --archive c1/etc/ ./etc-backup/

  ## OCI イメージラベルと環境 <!-- OCI image labels and environment -->
  <!--
  Images imported from OCI registries now expose their standard labels (`org.opencontainers.image.*`) as `oci.*` image properties, making the image title, version, source or description visible through `incus image info` and usable with the new image property columns.
  -->
  OCI レジストリーからインポートされたイメージは、`oci.*` イメージプロパティーとして、標準ラベル（`org.opencontainers.image.*`）を公開するようになりました。これにより、イメージタイトル、バージョン、ソース、説明などが `incus image info` で確認できるようになり、新しいイメージプロパティー列で利用できるようになります。

  <!--
  The image environment is also no longer copied into the instance configuration at creation time. Instead it's used as the default environment for `incus exec`, keeping the instance configuration clean and letting image updates carry environment changes.
  -->
  イメージ環境は、インスタンス作成時にインスタンス構成にコピーされなくなりました。代わりに、`incus exec` のデフォルト環境として使われます。インスタンスの設定をクリーンに保ちつつ、イメージの更新を通して環境の変更を反映できるようになります。

  ## ブリッジ DNS ホストレコード <!-- Bridge DNS host records -->
  <!--
  `bridge` networks gained a `dns.include_hosts` configuration key, controlling whether the network's `dnsmasq` serves records from the host's `/etc/hosts` file.
  -->
  `bridge` ネットワークに `dns.include_hosts` 設定キーが追加されました。これにより、ネットワークの `dnsmasq` がホストの `/etc/hosts` ファイルからレコードを提供するかどうかを制御できるようになります。

  <!--
  Setting it to `false` avoids exposing host-only entries to instances while keeping AppArmor confinement.
  -->
  これを `false` に設定すると、AppArmor による制限を保ちつつ、ホスト専用のエントリーがインスタンスに公開されるのを防ぐことができます。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/network_bridge/

  ## API を通したプロファイリング <!-- Profiling through the API -->
  <!--
  The Go `pprof` profiles of `incusd` are now available under `/internal/debug/pprof/` on every listener, restricted to clients allowed to administer the server.
  -->
  `incusd` の Go `pprof` プロファイルが、各リスナーの `/internal/debug/pprof/` 以下で利用できるようになりました。ただし、アクセスはサーバーの管理権限を持つクライアントに制限されています。

  <!--
  Unlike `core.debug_address`, this works at any time, over HTTPS and without changing the server configuration.
  -->
  `core.debug_address` と異なり、これは、HTTPS 経由で、サーバー設定の変更なしに動作します。

      stgraber@vorash:~$ incus query --raw my-remote:/internal/debug/pprof/heap > heap.pprof
      stgraber@vorash:~$ go tool pprof heap.pprof

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/debugging/#profiling-incusd

  # すべての変更点 <!-- Complete changelog -->

  <!--
  Here is a complete list of all changes in this release:
  -->
  このリリースのすべての変更のリストは次のとおりです（翻訳なし）:

  [details="すべてのChangeLogを見る"]
   - incus-agent: Abstract exec process handling
   - incus-agent: Report exit status of Windows exec sessions
   - incus-agent: Fix PATHEXT for Windows exec sessions
   - incus-agent: Forward exec signals on Windows
   - incus-agent: Support interactive exec sessions on Windows
   - incusd/instance/edk2: Add FirmwarePair.HasNVRAM
   - incusd/scriptlet/qemu: Handle firmwares without NVRAM
   - incusd/instance/qemu: Skip NVRAM handling with SeaBIOS firmware
   - doc: Note NVRAM scriptlet functions need EDK2 firmware
   - incusd: Validate OCI config.json before use
   - incusd: Consistently say 'an NVRAM'
   - incusd/instance/qemu: Close NVRAM file after writing
   - incusd/instance/qemu: Never drop runtime state while QEMU is alive
   - incusd/instance/qemu/qmp: Raise default command timeout to 2s
   - client/oidc: Route provider requests through a dedicated transport
   - client/oidc: Drop empty form parameters sent to the provider
   - incusd/device: Allow importing dependent volumes with snapshots
   - tests: Check dependent volume snapshots survive export/import
   - incusd/storage/drivers: Add cluster size to qcow2 ImageInfo
   - incusd/instance/qemu: Advertise qcow2 cluster size as discard granularity
   - internal/io: Add GetUmask and Lchtimes helpers
   - incus/file: Add --archive to file push/pull
   - tests: Add --archive file transfer coverage
   - i18n: Update translation templates
   - incus/cluster: Don't use unix socket URL as the join address
   - incus-agent: Externalize PTY logic
   - incus-agent: Basic signal handling on Windows
   - incus-agent: Add NetBSD agent
   - incusd/instance/agent-loader: Add NetBSD files
