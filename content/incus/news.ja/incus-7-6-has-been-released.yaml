title: Incus 7.6 リリースのお知らせ
date: 2026/10/30 17:01
origin: https://discuss.linuxcontainers.org/t/incus-7-6-has-been-released/27462
content: |-
  <!--
  The Incus team is pleased to announce the release of Incus 7.6!
  -->
  Incus チームは、Incus 7.6 のリリースのアナウンスができてうれしいです!

  <!--
  Another busy release with a strong focus on performance and smoother operations for larger environments, but that doesn't mean that standalone deployments have been left behind either with a number of improvements and new features targeting those too!
  -->
  パフォーマンスと大規模環境でのスムーズなオペレーションに重点を置いた、充実した内容のリリースです。もちろん、スタンドアロン向けの改善や新機能もたくさん盛り込まれており、決して大規模環境以外を忘れているわけではありません。

  [![Screenshot 2026-10-30 at 12.18.11 PM|690x450](upload://e2tC30QboZvgV2JAMxh4PltgDfv.webp)](https://linuxcontainers.org/incus/try-it/)

  <!--
  As usual, you can try Incus for yourself online: https://linuxcontainers.org/incus/try-it/
  -->
  いつものように、オンラインでご自身で試せます: [Linux Containers - Incus - オンラインでの試用](https://linuxcontainers.org/ja/incus/try-it/)

  # セキュリティ修正 <!-- Security fixes -->
  <!--
  This release fixes 18 security issues:
  -->
  このリリースでは 18 の脆弱性を修正しました:

   - [GHSA-3wxw-5gh2-j2x2](https://github.com/lxc/incus/security/advisories/GHSA-3wxw-5gh2-j2x2) (critical) - OCI イメージの設定と `oci.*` キーを通したコンテナ設定インジェクション <!-- Container configuration injection through OCI image config and `oci.*` keys -->
   - [GHSA-5c64-j5m6-8433](https://github.com/lxc/incus/security/advisories/GHSA-5c64-j5m6-8433) (critical) - 制限されたクライアントがデフォルトプロジェクト内でリソースにアクセスでき、リソースを作成できる <!-- Restricted clients can create and access resources in the default project -->
   - [GHSA-5pgx-q9xx-j3qv](https://github.com/lxc/incus/security/advisories/GHSA-5pgx-q9xx-j3qv) (critical) - 制限されたプロジェクトのユーザーが、バックアップやイメージメタデータ内の特殊ファイル、ハードもしくはシンボリックリンクを通してホストのファイルを読みとり、または上書き可能 <!-- Restricted project users can read or overwrite host files through special files, hard links or symlinks in backup or image metadata -->
   - [GHSA-cwg9-8mc4-hf7j](https://github.com/lxc/incus/security/advisories/GHSA-cwg9-8mc4-hf7j) (critical) - トークン操作がイベントストリームを通して公開されており、任意のクライアントからキャンセル可能 <!-- Token operations exposed through the event stream and cancellable by any client -->
   - [GHSA-jcw9-v2ff-8m79](https://github.com/lxc/incus/security/advisories/GHSA-jcw9-v2ff-8m79) (critical) - 制限されたプロジェクトのユーザーが、プロジェクトの隔離をバイパスして、デフォルトプロジェクト内でリソースを作成可能（dnsmasq 経由のホストの root 権限、mkfs 経由のホストのファイル読み取り） <!-- Restricted project users can create resources in the default project, bypassing project isolation (host root via dnsmasq, host file read via mkfs) -->
   - [GHSA-p45f-gqqj-6qq3](https://github.com/lxc/incus/security/advisories/GHSA-p45f-gqqj-6qq3) (critical) - カスタムボリュームのバックアップ内のスナップショット名を通したパストラバーサル <!-- Path traversal through snapshot names in custom volume backups -->
   - [GHSA-q9fc-p923-6vp7](https://github.com/lxc/incus/security/advisories/GHSA-q9fc-p923-6vp7) (critical) - マイグレーション時の依存ボリュームを通したパストラバーサル、クラッシュ、ストレージプール制限のバイパス <!-- Path traversal, crash and storage pool restriction bypass through dependent volumes in migration -->
   - [GHSA-xg75-xf37-cph9](https://github.com/lxc/incus/security/advisories/GHSA-xg75-xf37-cph9) (critical) - 検証されていないクライアント証明書チェーンを通した認証・認可のバイパス <!-- Authentication and authorization bypass through unverified client certificate chains -->
   - [GHSA-3rgf-297m-775x](https://github.com/lxc/incus/security/advisories/GHSA-3rgf-297m-775x) (high) - ローカルユーザーが VM NBD マイグレーションやディスクエクスポート用ソケットをハイジャック可能 <!-- Local users can hijack VM NBD migration and disk-export sockets -->
   - [GHSA-8r3h-vc36-6xpx](https://github.com/lxc/incus/security/advisories/GHSA-8r3h-vc36-6xpx) (high) - 制限された、閲覧専用クライアントが、デフォルトプロジェクト内のリソースを読み取り可能 <!-- Restricted and view-only clients can read resources in the default project -->
   - [GHSA-9c46-v3hw-v6m8](https://github.com/lxc/incus/security/advisories/GHSA-9c46-v3hw-v6m8) (high) - 一度も起動していないコンテナをリビルドすると、User Namespace なしで起動でき、特権で実行される <!-- Rebuilding a never-started container makes it boot without a user namespace, running as privileged -->
   - [GHSA-h2j8-4crh-vhfc](https://github.com/lxc/incus/security/advisories/GHSA-h2j8-4crh-vhfc) (high) - Incus がマイグレーション用の WebSocket のシークレットをプロジェクトのイベントリスナーに公開し、マイグレーションハイジャックが可能 <!-- Incus exposes migration websocket secrets to project event listeners, allowing migration hijack -->
   - [GHSA-v736-5xp3-jghf](https://github.com/lxc/incus/security/advisories/GHSA-v736-5xp3-jghf) (high) - 偽造された cgroup 名によるゲスト API 呼び出し元のなりすまし <!-- Guest API caller impersonation through a forged cgroup name -->
   - [GHSA-8mgx-h4v8-xqv2](https://github.com/lxc/incus/security/advisories/GHSA-8mgx-h4v8-xqv2) (medium) - S3 リスナーが、認証前に署名付きリクエストボディーをバッファーに格納する <!-- S3 listener buffers signed request bodies before authentication -->
   - [GHSA-9f75-5fjw-5jvv](https://github.com/lxc/incus/security/advisories/GHSA-9f75-5fjw-5jvv) (medium) - Incus が OVN ACL ログイベントを空のプロジェクトとしてブロードキャストし、他のプロジェクトの情報を漏洩させる <!-- Incus broadcasts OVN ACL log events with an empty project, leaking them across projects -->
   - [GHSA-f7xp-22ph-v444](https://github.com/lxc/incus/security/advisories/GHSA-f7xp-22ph-v444) (medium) - Incus のゲスト API によるイメージエクスポートが、ゲストプロジェクトを無視し、他のプロジェクトのイメージを公開する <!-- Incus guest-API image export ignores the guest's project, exposing other projects' images -->
   - [GHSA-pf5w-m8m6-5265](https://github.com/lxc/incus/security/advisories/GHSA-pf5w-m8m6-5265) (medium) - 再帰的応答や、すべてのプロジェクトに関する応答で、他のプロジェクトの S3 バケットキーやプロファイル設定を制限されたクライアントに公開する（GHSA-x8gj-2q73-qr6j の不完全な修正による） <!-- Recursive and all-projects responses disclose other projects' bucket S3 keys and profile configuration to restricted clients (incomplete fix of GHSA-x8gj-2q73-qr6j) -->
   - [GHSA-x6pw-mh5w-pq73](https://github.com/lxc/incus/security/advisories/GHSA-x6pw-mh5w-pq73) (medium) - インスタンスバックアップ内の null スナップショットエントリーによる DoS <!-- Denial of service via a null snapshot entry in an instance backup -->

  # 新機能 <!-- New features -->

  ## SR-IOV NIC のライブマイグレーション <!-- SR-IOV NIC live migration -->
  <!--
  Virtual machines using `sriov` NICs can now be live migrated between cluster members.
  -->
  `sriov` を使っている仮想マシンの NIC が、クラスターメンバー間でライブマイグレーションできるようになりました。

  <!--
  Two mechanisms are supported:
  -->
  2 つのメカニズムをサポートします:

   - `sriov` ネットワークと NIC の両方で、新たに `failover` オプションが追加されました。このオプションには（Incus 管理の場合でも、そうでない場合でも）ブリッジ名を指定します。すると、Incus は SR-IOV VF に加えて、そのブリッジ上に `virtio-net` フェイルオーバー NIC を追加します。これにより、`virtio-net` フェイルオーバーをサポートするゲストは、マイグレーション中にターゲットで VF が割り当てられるまでの間、透過的に `virtio-net` に切り替えることができます<!--  A new `failover` option on both `sriov` networks and NICs takes the name of a bridge (managed or not). Incus then adds a `virtio-net` failover NIC on that bridge alongside the SR-IOV VF, letting guests which support `virtio-net` failover transparently switch to it during the migration before getting a VF back on the target. -->
   - VFIO バリアントドライバー（現時点では `mlx5_vfio_pci` 用の `mlx5`）を選択する `variant` オプションが新たに追加されました。これにより、VF 自体のネイティブな VFIO ライブマイグレーションができるようになります <!-- A new `variant` option selects a VFIO variant driver (currently `mlx5` for `mlx5_vfio_pci`) which allows for native VFIO live migration of the VF itself. -->

  <!--
  Initial support for `switchdev` mode was also added, with Incus configuring the VF representors as needed and allowing VLANs to be used with such NICs.
  -->
  `switchdev` モードの初期サポートも追加されました。Incus が必要に応じて VF リプレゼンター（VF representor）を設定し、このような NIC で VLAN が使えるようになります。

      stgraber@vorash:~$ incus network create sriov0 --type=sriov parent=enp5s0f0 failover=incusbr0
      stgraber@vorash:~$ incus launch images:debian/13 v1 --vm --network sriov0
      stgraber@vorash:~$ incus move v1 --target server02

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/network_sriov/

  ## 仮想マシンのライブマイグレーションの高速化 <!-- Faster virtual machine live migrations -->
  <!--
  Live migration of virtual machines now uses QEMU's `multifd` feature, transferring memory over multiple parallel channels and significantly improving throughput on fast networks.
  -->
  仮想マシンのライブマイグレーションは、QEMU の `multifd` 機能を使うようになりました。これにより、メモリーが複数の並行チャンネルを通して転送され、高速ネットワーク上のスループットが大幅に向上します。

  <!--
  The memory and state transfer rate can also be capped through the new `instances.migration.bwlimit` server option, which is useful on shared networks where a single migration shouldn't be allowed to consume all the available bandwidth.
  -->
  サーバーに `instances.migration.bwlimit` オプションを設定することで、メモリーと状態の転送に上限を設定することもできます。これにより、単一のマイグレーションが利用可能な帯域すべてを消費することを防ぐ必要がある共有ネットワーク環境で有用です。

      stgraber@vorash:~$ incus config set instances.migration.bwlimit=500MiB

  <!--
  Block volume transfers through the generic migration transport (used when the source and target storage drivers differ, as well as by `incus-migrate`) are now compressed with `lz4` when both sides support it.
  -->
  汎用のマイグレーション転送（マイグレーション元と先で異なるストレージドライバーを使う場合や、`incus-migrate` を使う場合に使われる）を使ったブロックボリュームの転送では、双方がサポートしている場合は `lz4` で圧縮されるようになりました。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/server_config/

  ## 仮想マシンの I/O とメモリーのパフォーマンス <!-- Virtual machine I/O and memory performance -->
  <!--
  A number of changes improve the performance of virtual machines:
  -->
  いくつかの変更で、仮想マシンのパフォーマンスが向上しました:

   - `virtio` ディスクは、専用の I/O スレッドを使って実行されるようになりました。これにより、ディスク I/O がメインループから外れ、スループットとレイテンシーの両方が向上します <!-- `virtio` disks now run through a dedicated QEMU I/O thread, taking disk I/O off the main loop and improving both throughput and latency. -->
   - `virtiofs` が必要でない仮想マシン（`security.nesting` が `true` に設定されたネストされた仮想環境、ステートフルマイグレーション、`virtiofsd` がないホスト）は、共有メモリーではなく通常のメモリーを使って起動するようになりました。これにより、トランスペアレントヒュージページ（transparent huge page）が使えるようになり、特にネストされた仮想環境で非常に大きなパフォーマンスの向上をもたらします <!-- Virtual machines that don't need `virtiofs` (nested virtualization with `security.nesting` set to `true`, stateful migration or hosts without `virtiofsd`) are now started with regular memory rather than shared memory, allowing transparent huge pages to be used. This makes a very significant difference for nested virtualization. -->
   - メモリーバルーンでフリーページレポーティング（Free page reporting）が有効になりました。これにより、ゲストにより解放されたメモリーをホストが回収できるようになります <!-- Free page reporting is now enabled on the memory balloon, allowing the host to reclaim memory freed by the guest. -->
   - ゲストから要求される大きな `write-zeroes` リクエストが、より小さなチャンクに分割されるようになりました。これによりディスク I/O 制限が適切に適用されるようになります <!-- Large `write-zeroes` requests from the guest are now split into smaller chunks so that disk I/O limits apply to them properly. -->

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/explanation/performance_tuning/#virtual-machine-memory-allocation

  ## カスタムボリュームのインスタンス追従 <!-- Custom volumes can follow their instances -->
  <!--
  Custom storage volumes on local storage pools can now be set to move along with the virtual machine they're attached to when it's moved to another cluster member, through the new `migration.follow_instance` volume option.
  -->
  ローカルストレージ上のカスタムストレージボリュームは、新たに追加されたボリュームオプションである `migration.follow_instance` を使って、仮想マシンが別のクラスターメンバーに移動する際に、それにアタッチされているボリュームも一緒に移動するように設定できるようになりました。

  <!--
  This only applies to volumes attached to a single virtual machine.
  -->
  この機能は、単一の仮想マシンにアタッチされているボリュームにのみ適用されます。

      stgraber@vorash:~$ incus storage volume set local data migration.follow_instance=true
      stgraber@vorash:~$ incus move v1 --target server02

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/howto/move_instances/

  ## CA の信頼 <!-- Trusting a certificate authority -->
  <!--
  A CA certificate can now be added to the trust store, in which case any client certificate issued by that CA is trusted as if the CA entry itself had been presented.
  -->
  CA 証明書を信頼ストアに追加できるようになりました。この場合、その CA によって発行されたクライアント証明書は、CA エントリー自体が提示されているかのように信頼されます。

  <!--
  Such clients are identified by the fingerprint of the CA entry and inherit its type, restrictions and projects. This makes it easy to use short-lived certificates from an internal PKI without having to update the trust store on every renewal.
  -->
  このようなクライアントは、CA エントリーのフィンガープリントによって識別され、そのタイプ、制限、プロジェクトを継承します。これにより、更新のたびにトラストストアを更新する必要なく、内部 PKI の有効期間が短い証明書を簡単に利用できるようになります。

      stgraber@vorash:~$ incus config trust add-certificate ca.crt --restricted --projects=dev

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/authentication/#trusting-a-certificate-authority

  ## OVN NIC のセキュリティーフィルタリング <!-- OVN NIC security filtering -->
  <!--
  The `security.mac_filtering`, `security.ipv4_filtering` and `security.ipv6_filtering` options are now available on OVN NICs, matching what's available on bridged NICs.
  -->
  `security.mac_filtering`、`security.ipv4_filtering`、`security.ipv6_filtering` オプションが OVN NIC 上で利用できるようになりました。これは、ブリッジ型 NIC で利用できるものと同じ機能です。

  <!--
  They're implemented through OVN port security, restricting the source MAC address and, when IP filtering is enabled, the IP addresses (including any static routes) that the instance may use.
  -->
  これらのオプションは、OVN ポートセキュリティー機能によって実装されており、送信元 MAC アドレスを制限し、IP フィルタリングが有効な場合は、インスタンスが使用できる IP アドレス（任意のスタティックルートを含む）を制限します。

      stgraber@vorash:~$ incus config device set c1 eth0 security.mac_filtering=true security.ipv4_filtering=true security.ipv6_filtering=true

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/devices_nic/#nic-ovn

  ## OVN ネットワークの親の変更 <!-- OVN network re-parenting -->
  <!--
  The `parent` option of OVN networks, introduced in Incus 7.5, can now be changed on existing networks, moving the network from one logical router to another.
  -->
  Incus 7.5 で導入された、OVN ネットワークの `parent` オプションが、既存のネットワークに対しても変更できるようになりました。これにより、ネットワークを特定の論理ルーターから他の論理ルーターに移動できるようになりました。

  <!--
  Address forwards, load balancers and the SNAT rules of NICs with external addresses are moved along to the new parent. Removing the `parent` turns the network back into a standalone network.
  -->
  アドレス転送、ロードバランサー、外部アドレスを持つ SNAT ルールは、新しい親へ移動します。`parent` 設定を削除すると、そのネットワークは独立したネットワークに戻ります。

      stgraber@vorash:~$ incus network set net2 parent=net3

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/network_ovn/#child-networks

  ## l2proxy Ingressモードの NAT アドレス <!-- NAT address with l2proxy ingress mode -->
  <!--
  The `ipv4.nat.address` and `ipv6.nat.address` options on OVN networks were previously limited to uplinks using `ovn.ingress_mode=routed`.
  -->
  OVN ネットワークの `ipv4.nat.address` と `ipv6.nat.address` オプションは、以前は `ovn.ingress_mode=routed` を使ったアップリンクに限定されていました。

  <!--
  They're now also supported with the default `l2proxy` ingress mode, in which case the NAT address is advertised on the uplink through proxy ARP/NDP.
  -->
  これらが、デフォルトの `l2proxy` イングレスモードでもサポートされるようになりました。この場合、NAT アドレスはプロキシー ARP/NDP を通してアップリンク上で広告されます。

      stgraber@vorash:~$ incus network set ovn0 ipv4.nat.address=203.0.113.10

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/network_ovn/

  ## BGP コミュニティー <!-- BGP communities -->
  <!--
  A new `bgp.communities` option on `bridge` and `ovn` networks takes a comma-separated list of standard BGP communities (`ASN:value`) which are attached to all the prefixes advertised by that network.
  -->
  `bridge` と `ovn` ネットワークに、新たな `bgp.communities` オプションが追加されました。このオプションには、標準 BGP コミュニティー（`ASN:value` 形式）をカンマ区切りで指定します。ここで指定したコミュニティーは、そのネットワークから広告されるすべてのプレフィックスに付与されます。

      stgraber@vorash:~$ incus network set incusbr0 bgp.communities=65000:100,65000:200

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/howto/network_bgp/

  ## ロードバランサーのライフサイクルイベント <!-- Load balancer lifecycle events -->
  <!--
  Network load balancers now emit `network-load-balancer-created`, `network-load-balancer-updated` and `network-load-balancer-deleted` lifecycle events.
  -->
  ネットワークロードバランサーで、ライフサイクルイベント `network-load-balancer-created`、`network-load-balancer-updated`、`network-load-balancer-deleted` が発行されるようになりました。

  <!--
  On top of that, a `network-load-balancer-health-changed` event is sent whenever a load balancer goes healthy or unhealthy, including the status of each of its backends' service monitors.
  -->
  それに加えて、ロードバランサーの状態が正常や異常に変化するたびに、`network-load-balancer-health-changed` イベントが送信されます。このイベントには、各バックエンドのサービスモニターの状態も含まれます。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/events/

  ## クラスター修復遅延 <!-- Cluster healing delay -->
  <!--
  Cluster healing is commonly combined with external tooling that powers off the failed server through its BMC or PDU, to make sure it's not still accessing shared storage while its instances get restarted elsewhere.
  -->
  クラスターの修復は一般的に、BMC や PDU を通して障害が発生したサーバーの電源を落とすような外部ツールと組み合わされます。これにより、インスタンスが他で再起動されるまでの間、そのサーバーが共有ストレージにアクセスし続けるようなことを確実に防ぎます。

  <!--
  To make that reliable, Incus now sends a new `cluster-member-offline` lifecycle event as soon as a member is detected as offline and a new `cluster.healing_delay` server option controls how long to wait before the evacuation actually begins.
  -->
  これを確実にするために、Incus はメンバーがオフラインになったことを検知するとすぐに、新たに `cluster-member-offline` ライフサイクルイベントを送るようになりました。そして、新たに追加された `cluster.healing_delay` サーバーオプションにより、インスタンスが実際に退避を開始するまでに待機する時間を制御できるようになりました。

      stgraber@vorash:~$ incus config set cluster.healing_delay=60

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/howto/cluster_manage/

  ## インスタンス状態内の TPM エンドースメントキー <!-- TPM endorsement keys in instance state -->
  <!--
  When `instances.tpm.platform_cert` is set, Incus provisions new TPM devices with endorsement keys and certificates signed by the platform CA.
  -->
  `instances.tpm.platform_cert` が設定されると、Incus は保証鍵（Endorsement Key）とプラットフォーム CA によって署名された証明書を格納した新しい TPM デバイスを使用可能状態に設定します。

  <!--
  The public part of those endorsement keys is now exposed through the instance state (and shown in `incus info`), both as a SHA-256 fingerprint and as a PEM encoded public key, allowing an external attestation service to bind an endorsement key to a specific instance without accessing the guest.
  -->
  これらの保証鍵の公開鍵部分は、インスタンス状態を通して（そして `incus info` での表示を通して）確認できるようになりました。これは SHA-256 フィンガープリントと PEM エンコードされた公開鍵の両方が提供されます。これにより、外部の証明サービス（attestation service）は、ゲストにアクセスすることなく保証鍵を特定のインスタンスに紐づけることができます。

      stgraber@vorash:~$ incus query /1.0/instances/v1/state | jq .tpm

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/devices_tpm/#endorsement-keys

  ## インスタンス状態内のディスク I/O カウンター <!-- Disk I/O counters in instance state -->
  <!--
  The `disk` section of the instance state now includes a `counters` field for each disk, reporting bytes read and written along with the number of completed read and write operations.
  -->
  インスタンス状態の `disk` セクションに、ディスクごとに `counter` フィールドが含まれるようになりました。このフィールドは、読み書きのバイト数と、完了した読み書き操作の回数が記録されます。

  <!--
  This is currently only populated for virtual machines, using the block statistics reported by QEMU.
  -->
  現時点では、QEMU がレポートするブロック統計を利用する仮想マシンでのみ、この情報が格納されます。

      stgraber@vorash:~$ incus query /1.0/instances/v1/state | jq .disk

  ## ブートプライオリティーの改良 <!-- Boot priority improvements -->
  <!--
  The `boot.priority` option on NIC and disk devices can now be set to `skip` to exclude the device from the boot sequence of a virtual machine. NICs are now skipped by default, avoiding slow network boot attempts on every start.
  -->
  NIC とディスクデバイスの `boot.priority` オプションに、`skip` を設定できるようになりました。これを指定すると、そのデバイスは仮想マシンのブートシーケンスから除外されます。NIC はデフォルトでスキップされるようになったため、起動ごとに遅いネットワークブートが試行されることを防げます。

  <!--
  A new `boot.pxe` instance option (defaulting to `false`) enables PXE on all the NICs that are part of the boot sequence. HTTP boot remains always enabled for those NICs.
  -->
  新たに追加された `boot.pxe` インスタンスオプション（デフォルトは `false`）を有効にすると、ブートシーケンスに含まれるすべての NIC で PXE が利用可能になります。これらの NIC に対しては、HTTP ブートが常に有効なままになります。

      stgraber@vorash:~$ incus config device set v1 eth0 boot.priority=10
      stgraber@vorash:~$ incus config set v1 boot.pxe=true

  ドキュメント<!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/reference/devices_nic/

  ## S3 バックアップのターゲットリージョン <!-- S3 backup target region -->
  <!--
  Instance and volume backups uploaded to an S3 compatible store can now be given a `region`, for stores whose region can't be derived from their URL.
  -->
  S3 互換ストレージにアップロードされるインスタンスとボリュームのバックアップに、`region` を指定できるようになりました。これにより、URL からリージョンが特定できないストアでリージョンを指定できるようになりました。

  ## クライアント証明書の生成 <!-- Client certificate generation -->
  <!--
  The `incus remote generate-certificate` command now accepts `\-\-tls-cert` and `\-\-tls-key` to generate a separate client certificate and key at the chosen paths, as well as `\-\-encrypt` to protect the newly generated private key with a passphrase.
  -->
  `incus remote generate-certificate` コマンドで `--tls-cert` と `--tls-key` を指定できるようになりました。これにより、指定したパスにクライアント証明書と秘密鍵を個別に生成できます。また、`--encrypt` オプションを使い、新たに生成する秘密鍵をパスフレーズで保護できます。

      stgraber@vorash:~$ incus remote generate-certificate --tls-cert ./my-client.crt --tls-key ./my-client.key --encrypt
      stgraber@vorash:~$ incus remote add my-remote <token> --tls-cert ./my-client.crt --tls-key ./my-client.key

  ドキュメント<!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/remotes/#generate-a-client-certificate

  ## 認可スクリプトレットにおけるリクエストの詳細 <!-- Request details in the authorization scriptlet -->
  <!--
  The `details` argument passed to the authorization scriptlet now includes the request `URL`, `Path`, `Query` parameters and HTTP `Method`, allowing for much finer grained authorization decisions.
  -->
  認可スクリプトレットに与える `details` 引数に、`URL`、`Path`、`Query` パラメータと、HTTP `Method` を含められるようになりました。これにより、細かな認証の判断が可能になりました。

  ドキュメント<!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/authorization/#scriptlet

  ## TLS JWT Cookie ログイン <!-- TLS JWT cookie login -->
  <!--
  Browser based clients can't set HTTP headers on WebSocket connections, which made it impossible for them to use TLS JWT tokens for things like the console or exec.
  -->
  ブラウザーベースのクライアントでは、WebSocket 接続で HTTP ヘッダーをセットできないため、console や exec などに TLS JWT トークンを使用することができなくなりました。

  <!--
  New `/tls/login` and `/tls/logout` endpoints now allow such clients to send the token once and have it stored in a `Secure`, `HttpOnly` cookie which is then accepted by all API endpoints and WebSocket connections until the token expires.
  -->
  新たなエンドポイントである `/tls/login` と `/tls/logout` を使って、このようなクライアントはトークンを一度送ることで、それが `Secure`、`HttpOnly` クッキーに保存されるようになります。このクッキーは、トークンの有効期限が切れるまで、すべての API エンドポイントと WebSocket 接続で受け入れられます。

  ドキュメント<!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/authentication/

  ## OIDC opaque アクセストークン <!-- OIDC opaque access tokens -->
  <!--
  Incus now supports OIDC providers that issue opaque (non-JWT) access tokens.
  -->
  Incus は、（JWT ではない）opaque アクセストークンを発行する OIDC プロバイダーをサポートするようになりました。

  <!--
  In that case, Incus verifies the ID token instead, checking that it was issued by the configured issuer for the configured client ID. The `incus` client transparently sends the ID token alongside the opaque access token.
  -->
  この場合、Incus は代わりに ID トークンを検証し、設定済みのクライアント ID に対して設定済みの Issuer から発行されたものであることをチェックします。`incus` クライアントは、ID トークンを opaque アクセストークンとともに透過的に送信します。

  ドキュメント<!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/authentication/#authentication-openid

  ## loongarch64 の試験的なサポート <!-- Preliminary loongarch64 support -->
  <!--
  Incus can now run on `loongarch64` systems, including preliminary support for virtual machines with the matching EDK2 firmware.
  -->
  Incus が `loongarch64` システム上で実行できるようになりました。対応する EDK2 ファームウェアを使用した仮想マシンの試験的なサポートが含まれます。

  ドキュメント <!-- Documentation -->: https://linuxcontainers.org/incus/docs/main/architectures/

