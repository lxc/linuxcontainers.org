title: Incus 7.0.1 LTS リリースのお知らせ
date: 2026/07/10 22:07
origin: https://discuss.linuxcontainers.org/t/incus-7-0-1-lts-has-been-released/26942
content: |-
  # はじめに <!-- Introduction -->
  <!--
  The Incus team is pleased to announce the release of Incus 7.0.1!
  This is the first bugfix release for Incus 7.0 which is supported until June 2031.
  -->
  Incus チームは、Incus 7.0.1 のアナウンスができることをうれしく思います!
  このリリースは、2031 年 6 月までサポートされる Incus 7.0 の最初のバグ修正リリースです。

  <!--
  Of note, with the 7.0.x series, we are decoupling the bugfix updates of our various projects, so there won't be an update of LXC and LXCFS at the same time as this one.
  -->
  なお、7.0.x シリーズでは各プロジェクトのバグ修正アップデートを切り離して実施するため、今回のアップデートと同時に LXC や LXCFS が更新されることはありません。

  # 変更点 <!-- Changes -->
  <!--
  As usual this bugfix releases focus on stability and hardening.
  -->
  いつもと同様に、このバグ修正リリースは安定性とセキュリティ強化に重点を置いています。

  <!--
  Minor improvements have also been backported, specifically anything which does not require data migration, database changes or cause any unexpected change to user facing behavior.
  -->
  データ移行やデータベースの変更を必要としない、あるいはユーザーが動作の変更に直面するような予期せぬ変更をもたらさないような軽微な改善点もバックポートされています。

  <!--
  The number of such improvements will decrease over time within the LTS branch.
  -->
  LTS ブランチ内では、このような改善数は時間とともに減少していくでしょう。

  <!--
  Some of the highlights for this release are:
  -->
  このリリースのハイライトのいくつかは次のとおりです:

   - カスタムストレージボリュームの再構築 <!-- Rebuilding custom storage volumes -->
   - 仮想マシン向けの明示的な CPU トポロジー <!-- Explicit CPU topology for virtual machines -->
   - カスタム TPM プラットフォーム証明書 <!-- Custom TPM platform certificate -->
   - ボリューム作成時のアタッチ <!-- Volume creation on attach -->
   - ストレージ用のファイルシステム作成オプション <!-- Filesystem creation options for storage -->
   - 低レベル LINSTOR 設定 <!-- Low-level LINSTOR configuration -->
   - ネットワークアドレスセットの IP レンジ <!-- IP ranges in network address sets -->
   - ブリッジネットワークにおけるマルチキャストスヌーピング制御 <!-- Multicast snooping control on bridge networks -->
   - リモートごとの複数のアドレス <!-- Multiple addresses per remote -->
   - S3 オブジェクトストレージの改良 <!-- S3 object storage improvements -->
   - インスタンスごとの SELinux 統合 <!-- Per-instance SELinux integration -->
   - 新しい `incus default` CLI コマンド <!-- New `incus default` CLI command -->
   - デフォルトでフィルタリングされたサーバー情報 <!-- Filtered server info by default -->
   - CLI からの Keepalive タイムアウト <!-- Keepalive timeout from the CLI -->
   - CLI 設定の OS ごとの適切な処理 <!-- Better OS-specific handling of CLI configuration -->
   - スタンドアロンサーバーの証明書更新 <!-- Standalone server certificate update -->
   - OCI コンテナの静的ネットワーク設定 <!-- Static network configuration for OCI containers -->
   - インスタンスごとの BGP ルートアドバタイズ <!-- Per-instance BGP route advertisement -->
   - プロキシー NAT モードでのダイナミックアドレス <!-- Dynamic addresses in proxy NAT mode -->
   - VM に対する NBD アクセスの拡張 <!-- Expanded NBD access to VMs -->
   - ストレージボリュームの Btrfs 圧縮 <!-- Btrfs compression for storage volumes -->
   - InfiniBand の SR-IOV GUID 設定 <!-- InfiniBand SR-IOV GUID configuration -->
   - Websocket オリジン制限 <!-- Websocket origin restriction -->

  <!--
  This update also addresses the following security issues:
  -->
  今回のアップデートでは、以下のセキュリティー問題にも対処しています:

  * [CVE-2026-48753](https://github.com/lxc/incus/security/advisories/GHSA-ccjc-4qc3-jxqc) (critical) -  S3マルチパートアップロードにおけるパストラバーサルによる任意のファイル書き込み <!-- Arbitrary file write via path traversal in S3 multipart upload -->
  * [CVE-2026-47753](https://github.com/lxc/incus/security/advisories/GHSA-8g7m-96c8-8wwc) (low) -  インスタンスバックアップのインポートにおける Nil ポインターデリファレンスパニック <!-- Nil-Pointer Dereference Panic via Instance Backup Import (volume omitted) -->
  * [CVE-2026-48754](https://github.com/lxc/incus/security/advisories/GHSA-4xg6-52mh-fpw8) (low) - createDependentVolumesFromBackup 内の Nil ポインターデリファレンス <!-- Nil-pointer dereference in createDependentVolumesFromBackup -->
  * [CVE-2026-48756](https://github.com/lxc/incus/security/advisories/GHSA-xhqx-mgh3-3h7q) (low) - CreateCustomVolumeFromBackup 内の Nil ポインターデリファレンス <!-- Nil-pointer dereference in CreateCustomVolumeFromBackup -->
  * [CVE-2026-48749](https://github.com/lxc/incus/security/advisories/GHSA-2q3f-q5pq-g8wv) (critical) - 悪意あるイメージ内の rootfs/ シンボリックリンクを経由したホスト上の任意のファイルの読み書き <!-- Arbitrary file read+write on host via `rootfs/` symlink in malicious image -->
  * [CVE-2026-48750](https://github.com/lxc/incus/security/advisories/GHSA-73hr-m85f-64v9) (critical) - 細工されたイメージ内の exec-output シンボリックリンクを介したホスト上の任意のファイルに対する書き込み <!-- Arbitrary file write on host via `exec-output` symlink in crafted image -->
  * [CVE-2026-48751](https://github.com/lxc/incus/security/advisories/GHSA-48q5-w887-33wv) (critical) - 任意のコマンド実行につながるプロジェクト制限のバイパス <!-- Restricted project bypass leading to arbitrary command execution -->
  * [CVE-2026-48752](https://github.com/lxc/incus/security/advisories/GHSA-vxp5-584q-c479) (critical) - 悪意あるイメージ内の templates/ シンボリックリンクを介したホスト上の任意のファイルの読み書き <!-- Arbitrary file read+write on host via `templates/` symlink in malicious image -->
  * [CVE-2026-48755](https://github.com/lxc/incus/security/advisories/GHSA-v6mj-8pf4-hhw4) (critical) - 任意のファイルへの書き込みおよびコマンド実行につながる、バックアップ圧縮アルゴリズムにおける引数インジェクション <!-- Argument injection in backup compression algorithm leading to arbitrary file write and command execution -->
  * [CVE-2026-48769](https://github.com/lxc/incus/security/advisories/GHSA-f6m5-xw2g-xc4x) (critical) - 信頼されたイメージハッシュに起因するクライアント上の任意のファイルに対する書き込み <!-- Arbitrary file write on client due to trusted image hash -->
  * [CVE-2026-55621](https://github.com/lxc/incus/security/advisories/GHSA-64f3-v33m-w89f) (high) - プロジェクト間のカスタムボリュームコピーに対するプロジェクト制限のバイパス <!-- Project restriction bypass for custom volume copy across projects -->
  * [CVE-2026-55622](https://github.com/lxc/incus/security/advisories/GHSA-c9f5-j9c3-mhrg) (high) - プロジェクト間のインスタンスコピーにおけるプロジェクト制限の回避 <!-- Project restriction bypass in instance copy across projects -->

  <!--
  All of those have been previously fixed in regular monthly releases and been widely backported by the various distributions shipping Incus 7.0 LTS.
  -->
  これらはすべて、通常の月次リリースで既に修正されており、Incus 7.0 LTS を出荷している様々なディストリビューションによって広くバックポートされています。

